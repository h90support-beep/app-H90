name: Build H90 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp -r *.html www/ 2>/dev/null || true
          cp -r *.css www/ 2>/dev/null || true
          cp -r *.js www/ 2>/dev/null || true
          cp -r *.json www/ 2>/dev/null || true
          cp -r *.png www/ 2>/dev/null || true
          cp -r *.jpg www/ 2>/dev/null || true
          cp -r *.jpeg www/ 2>/dev/null || true
          cp -r *.svg www/ 2>/dev/null || true
          cp -r *.webp www/ 2>/dev/null || true
          echo "📦 www folder contents:"
          ls -la www/

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Queries for H90 Player
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "com.h90.player" "$MANIFEST"; then
            sed -i 's|</manifest>|<queries><package android:name="com.h90.player" /></queries></manifest>|' "$MANIFEST"
            echo "✅ Added <queries> for H90 Player"
            echo "--- Verifying ---"
            grep -A2 "<queries>" "$MANIFEST" || echo "⚠️ grep failed"
          else
            echo "ℹ️ <queries> already exists"
          fi

      - name: Grant Execute Permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: H90-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Show Result
        run: |
          echo "✅ APK Build Complete!"
          ls -lh android/app/build/outputs/apk/debug/
