<!-- ================================================================
     H90 Rooms System v3.1 — محتوى الغرف
     ================================================================ -->

<!-- شاشة قائمة الغرف -->
<div id="roomsScreen" class="hidden">
    <div class="rooms-header">
        <h2>الغرف الصوتية والمرئية</h2>
        <button id="btn-close-rooms" class="close-btn">✕</button>
    </div>
    <div class="rooms-buttons-container">
        <button id="btn-join-room" class="main-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            الانضمام إلى غرفة
        </button>
        <button id="btn-create-room" class="main-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            إنشاء غرفة جديدة
        </button>
        <button id="btn-my-rooms" class="main-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            غرفي
        </button>
    </div>
</div>

<!-- مودال الانضمام -->
<div id="join-room-modal" class="modal">
    <div class="modal-content">
        <h3>الانضمام إلى غرفة</h3>
        <input type="text" id="join-room-name" placeholder="اسم الغرفة">
        <input type="password" id="join-room-pass" placeholder="كلمة السر">
        <input type="text" id="join-user-name" placeholder="اسمك (سيظهر للآخرين)">
        <button id="btn-confirm-join" class="modal-btn confirm">دخول</button>
        <button class="modal-btn cancel close-modal">إلغاء</button>
    </div>
</div>

<!-- مودال الإنشاء -->
<div id="create-room-modal" class="modal">
    <div class="modal-content">
        <h3>إنشاء غرفة جديدة</h3>
        <input type="text" id="create-room-name" placeholder="اسم الغرفة (فريد)">
        <input type="password" id="create-room-pass" placeholder="كلمة السر">
        <p class="warning-text">⚠️ الحد الأقصى للأعضاء هو 8 أشخاص.</p>
        <label for="create-room-duration">مدة الغرفة:</label>
        <select id="create-room-duration">
            <option value="1">ساعة واحدة</option>
            <option value="2">ساعتان</option>
            <option value="3">ثلاث ساعات</option>
        </select>
        <button id="btn-confirm-create" class="modal-btn confirm">إنشاء</button>
        <button class="modal-btn cancel close-modal">إلغاء</button>
    </div>
</div>

<!-- شاشة الغرفة -->
<div id="room-screen" class="hidden">
    
    <div class="room-header">
        <span id="room-title-display">اسم الغرفة</span>
        <div class="room-header-actions">
            <button id="btn-room-menu" class="room-btn" style="padding: 8px 10px; font-size: 16px;">⋮</button>
        </div>
        <div id="room-menu-dropdown" class="dropdown-menu">
            <button onclick="shareRoomLink()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:8px"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                مشاركة رابط الدعوة
            </button>
            <button onclick="openMembersManager()" class="admin-only">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:8px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                إدارة الأعضاء
            </button>
            <button id="btn-add-channel-menu" onclick="openChannelSelectModal()" class="admin-only">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:8px"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
                إضافة قناة
            </button>
            <button onclick="toggleRoomLock()" class="admin-only">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:8px"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                قفل / فتح الغرفة
            </button>
            <button onclick="handleLeaveRoomClick()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:8px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                مغادرة الغرفة
            </button>
        </div>
    </div>

    <div id="admin-panel" class="admin-panel room-hidden">
        <button id="btn-kick-member" class="room-btn warn">طرد عضو</button>
        <button id="btn-close-room" class="room-btn danger">حذف الغرفة</button>
    </div>

    <div id="video-player-area" class="room-hidden">
        <video id="room-video" playsinline webkit-playsinline></video>
        <div id="room-video-controls-overlay">
            <div class="controls-top">
                <button class="room-btn ghost" id="btn-close-video">✕ إغلاق البث</button>
            </div>
            <div class="controls-bottom">
                <button class="room-btn" id="btn-rewind">⏪ 10</button>
                <button class="room-btn" id="btn-play-pause">▶️</button>
                <button class="room-btn" id="btn-forward">⏩ 10</button>
                <button class="room-btn" id="btn-fullscreen">⛶</button>
            </div>
        </div>
    </div>

    <div id="chat-area">
        <div id="pinned-message-banner" class="pinned-banner"></div>
        <div id="chat-messages"></div>
        <div id="typing-indicator" class="typing-indicator"></div>
        <div id="reply-bar" class="reply-bar"></div>
        
        <div class="chat-input-area">
            <button id="btn-emoji" class="chat-action-btn" style="background: rgba(255,255,255,0.1); width: 40px; height: 40px;">😀</button>
            <input type="text" id="chat-input" placeholder="اكتب رسالتك...">
            <button id="btn-send-msg" class="chat-action-btn btn-send" title="إرسال">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
            </button>
            <button id="btn-voice-msg" class="chat-action-btn btn-voice" title="اضغط مع الاستمرار للتسجيل">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
        </div>
        <div id="emoji-picker" class="emoji-picker"></div>
    </div>
</div>

<!-- مؤشر التسجيل الصوتي -->
<div id="voice-recording-indicator">
    <span class="rec-dot"></span>
    <span>جارٍ التسجيل...</span>
    <span id="voice-timer">0:00 / 0:15</span>
</div>

<!-- قائمة التفاعلات -->
<div id="reaction-menu" class="reaction-menu">
    <span class="reaction-emoji" data-emoji="❤️">❤️</span>
    <span class="reaction-emoji" data-emoji="😂">😂</span>
    <span class="reaction-emoji" data-emoji="👍">👍</span>
    <span class="reaction-emoji" data-emoji="🔥">🔥</span>
</div>

<!-- مودال اختيار القناة -->
<div id="channel-select-modal" class="modal">
    <div class="modal-content">
        <h3>اختر قناة من السيرفر الثاني</h3>
        <div id="server2-channels-list" class="channels-list-container"></div>
        <button class="modal-btn cancel close-modal">إغلاق</button>
    </div>
</div>
